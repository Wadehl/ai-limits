name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (ad-hoc signed, no Apple Developer team)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-release.sh

      - name: Check widget extension registers
        run: ./scripts/check-widget-registration.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Linook-macOS
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            狸记额度（Linook）临时签名（ad-hoc）构建，未经过 Apple 公证。从 AiLimits 升级的话，先删掉「应用程序」里旧的 AiLimits.app。首次打开与桌面小组件的设置步骤见 README 的「安装」与「桌面小组件」两节。
            Ad-hoc signed, not notarized. See the Install and Desktop Widgets sections of the README.
