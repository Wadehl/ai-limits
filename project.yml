name: AiLimits
options:
  bundleIdPrefix: com.kevinkwok
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AiLimitsPackage:
    path: .

settings:
  base:
    DEVELOPMENT_TEAM: 52BF5GV693
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    # 桌面小组件读取快照的位置：appGroup 需要真实团队编号签名；local 给临时签名（ad-hoc）构建使用，见 README
    AILIMITS_SHARED_STORAGE: appGroup
    AILIMITS_APP_GROUP: $(DEVELOPMENT_TEAM).group.com.kevinkwok.ailimits

targets:
  AiLimits:
    type: application
    platform: macOS
    sources:
      - path: Sources/AiLimitsApp
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: AiLimitsPackage
        product: AiLimitsCore
      - package: AiLimitsPackage
        product: AiLimitsUI
      - target: AiLimitsWidgetExtension
        embed: true
        codeSign: true
    info:
      path: Build/AiLimits-Info.plist
      properties:
        CFBundleDisplayName: Agent 额度
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: Nunito 字体按 SIL Open Font License 1.1 使用
        AiLimitsSharedStorage: "$(AILIMITS_SHARED_STORAGE)"
        AiLimitsAppGroup: "$(AILIMITS_APP_GROUP)"
    entitlements:
      path: Build/AiLimits.entitlements
      properties:
        com.apple.security.application-groups:
          - $(AILIMITS_APP_GROUP)

  AiLimitsWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AiLimitsWidget
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: AiLimitsPackage
        product: AiLimitsCore
      - package: AiLimitsPackage
        product: AiLimitsUI
    info:
      path: Build/AiLimitsWidget-Info.plist
      properties:
        CFBundleDisplayName: Agent 额度
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AiLimitsSharedStorage: "$(AILIMITS_SHARED_STORAGE)"
        AiLimitsAppGroup: "$(AILIMITS_APP_GROUP)"
    entitlements:
      path: Build/AiLimitsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(AILIMITS_APP_GROUP)
        # local 模式下快照在 ~/Library/Application Support/AiLimits/，与 SnapshotStore.localRelativePath 一致
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/AiLimits/
